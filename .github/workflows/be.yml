name: Be CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backEnd/**'
      - '.github/workflows/be.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backEnd/**'
      - '.github/workflows/be.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # MongoDB Service Container
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backEnd

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x # Updated to 20 for better NestJS 11 compatibility
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: backEnd/package-lock.json

    - name: Install Dependencies
      run: npm ci # Use 'npm ci' for faster, consistent installs in CI

    - name: Lint Code
      run: npm run lint

    - name: Build Project
      run: npm run build

    - name: Run Tests
      run: npm run test
      env:
        # Pass the MongoDB URI to your NestJS app
        MONGODB_URI: mongodb://localhost:27017/test
        NODE_ENV: test

    - name: Run E2E Tests
      run: npm run test:e2e
      env:
        MONGODB_URI: mongodb://localhost:27017/test_e2e